<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Simple Chat</title>
<style>
:root{--text:#fff;--sub:rgba(255,255,255,.7);--glass:rgba(255,255,255,.16);--glass2:rgba(255,255,255,.1);--bd:rgba(255,255,255,.28);--me:rgba(37,211,102,.38);--acc:#25d366;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;
background:#0f2027;background:linear-gradient(135deg,#0f2027 0%,#203a43 45%,#2c5364 100%)}
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(60px);z-index:0;pointer-events:none}
body:before{width:260px;height:260px;background:#25d366;opacity:.45;top:-60px;left:-60px}
body:after{width:300px;height:300px;background:#7c3aed;opacity:.4;bottom:-80px;right:-80px}
.glass{background:var(--glass);border:1px solid var(--bd);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%)}

/* ===== iOS emoji images (Android/Windows par) ===== */
img.emo{display:inline-block;width:1.22em;height:1.22em;vertical-align:-.26em;margin:0 .02em;pointer-events:none;-webkit-user-drag:none}

/* ===== HOME (pehle jaisa) ===== */
#home,#auth{position:relative;z-index:1;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;padding:16px}
.card{border-radius:22px;padding:24px;width:100%;max-width:380px;box-shadow:0 8px 32px rgba(0,0,0,.35);margin:auto}
h1{margin:0 0 4px;font-size:24px}
.sub{color:var(--sub);font-size:14px;margin:0 0 16px}
input{width:100%;padding:13px 14px;border:1px solid var(--bd);border-radius:14px;background:var(--glass2);color:var(--text);font-size:16px;margin-bottom:10px;outline:none;font-family:inherit}
input::placeholder{color:var(--sub)}
button{width:100%;padding:13px;border:0;border-radius:14px;background:var(--acc);color:#063;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:10px;font-family:inherit}
button.alt{background:var(--glass2);color:#fff;border:1px solid var(--bd)}
.or{text-align:center;color:var(--sub);font-size:13px;margin:4px 0 10px}
#err{color:#ff8a8a;font-size:14px;min-height:18px}
.namerow{display:none;align-items:center;gap:8px;background:var(--glass2);border:1px solid var(--bd);border-radius:14px;padding:11px 14px;margin-bottom:10px}
.namerow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.namerow i{font-style:normal;color:var(--acc);font-weight:700;font-size:14px;cursor:pointer}
#myCodeBox{display:none;align-items:center;gap:8px;background:var(--glass2);border:1px solid var(--bd);border-radius:14px;padding:9px 14px;margin-bottom:10px;cursor:pointer;font-size:14px;color:var(--sub)}
#myCodeBox b{color:#fff;letter-spacing:2px;font-size:15px}
#myCodeBox i{margin-left:auto;font-style:normal;color:var(--acc);font-weight:700;font-size:13px}
.recent{margin-top:6px;max-height:34vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.recent h3{font-size:13px;color:var(--sub);margin:8px 0 6px;font-weight:600}
.rc{display:flex;align-items:center;gap:8px;background:var(--glass2);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;margin-bottom:6px;cursor:pointer}
.rc span{flex:1;font-weight:700;letter-spacing:2px}
.rc i{font-style:normal;padding:2px 8px;color:var(--sub)}
.rc .av{font-size:22px;line-height:1}
.rc .nn{flex:1;min-width:0}
.rc .nn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc .nn small{color:var(--sub);font-size:11px;letter-spacing:1px}

/* ===== CHAT (behtar design) ===== */
#chat{position:fixed;left:0;right:0;top:0;z-index:1;display:none;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px)}
header{margin:8px 8px 0;border-radius:20px;padding:7px 8px;display:flex;align-items:center;gap:2px;box-shadow:0 4px 18px rgba(0,0,0,.22)}
header .t{flex:1;min-width:0;padding-left:2px}
header b{display:block;font-size:16px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header small{display:block;color:var(--sub);font-size:12px;line-height:1.25;min-height:15px}
header small.typ{color:#8dffb5;font-weight:600}
header .code{background:var(--glass);border:1px solid var(--bd);border-radius:10px;padding:4px 9px;font-weight:700;letter-spacing:2px;font-size:13px;cursor:pointer;margin-left:2px}
header .avs{font-size:20px;margin:0 2px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.hb{background:none;width:auto;margin:0;padding:6px 9px;font-size:20px;color:#fff;border-radius:12px}
#msgs{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch}
.m{max-width:80%;padding:7px 12px;border-radius:18px 18px 18px 5px;align-self:flex-start;word-wrap:break-word;overflow-wrap:anywhere;font-size:15.5px;line-height:1.35;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.m.me{background:linear-gradient(135deg,rgba(37,211,102,.55),rgba(16,150,110,.42));border-color:rgba(37,211,102,.55);border-radius:18px 18px 5px 18px;align-self:flex-end}
.m .n{font-size:12px;font-weight:700;color:#8dffb5;margin-bottom:2px}
.m .tm{font-size:10px;color:var(--sub);text-align:right;margin-top:2px}
.m.big{background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;font-size:38px;line-height:1.15;padding:2px 4px}
.sys{align-self:center;color:var(--sub);font-size:12px;padding:4px 12px;border-radius:12px;background:var(--glass2)}
.tick{margin-left:4px;font-weight:700;letter-spacing:-2px}
.tick.sent,.tick.dlv{color:var(--sub)}
.tick.seen{color:#53bdeb}
.seenTxt{font-size:10px;color:#8dffb5;margin-left:6px;letter-spacing:0}
#f{display:flex;gap:6px;align-items:center;margin:0 8px 8px;padding:6px;border-radius:28px;box-shadow:0 4px 18px rgba(0,0,0,.22)}
#f input{margin:0;border-radius:22px;flex:1;min-width:0;padding:10px 14px}
#f button{width:42px;height:42px;border-radius:50%;margin:0;padding:0;font-size:18px;flex:none}
#f button.ic{width:38px;height:38px;background:transparent;color:#fff;border:0;font-size:21px}
#send{display:none;background:linear-gradient(135deg,#25d366,#12a37a)}
#mic{background:linear-gradient(135deg,#25d366,#12a37a);color:#063}
#blockBar,#reqBar{display:none;align-items:center;gap:8px;margin:0 8px 8px;padding:8px 8px 8px 16px;border-radius:24px;font-size:14px}
#blockBar span,#reqBar span{flex:1}
#blockBar button,#reqBar button{width:auto;margin:0;padding:9px 16px}
.m img.media,.m video.media{display:block;max-width:100%;max-height:300px;border-radius:12px;margin:2px 0;background:#000}
.m audio{display:block;width:230px;max-width:100%;height:40px}
.m{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#rec{display:none;align-items:center;gap:10px;margin:0 8px 8px;padding:6px 8px 6px 16px;border-radius:28px}
#rec .dot{width:12px;height:12px;border-radius:50%;background:#ff4d4d;animation:pulse 1s infinite}
#rec .tmr{flex:1;font-weight:700}
#rec button{width:44px;height:44px;border-radius:50%;margin:0;padding:0;font-size:18px;flex:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* emoji picker */
#emo{display:none;flex-direction:column;margin:0 8px 8px;border-radius:20px;height:236px;overflow:hidden}
#emo .cats{display:flex;border-bottom:1px solid var(--bd);flex:none}
#emo .cats button{flex:1;margin:0;padding:8px 0;background:none;color:#fff;font-size:19px;border-radius:0;width:auto;opacity:.5}
#emo .cats button.on{opacity:1;background:var(--glass2)}
#emo .grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(8,1fr);align-content:start;padding:6px;gap:2px;-webkit-overflow-scrolling:touch}
#emo .grid button{margin:0;padding:3px 0;background:none;font-size:27px;line-height:1.2;border-radius:10px;width:auto}
#emo .grid button:active{background:var(--glass)}
#emo .none{grid-column:1/-1;text-align:center;color:var(--sub);font-size:13px;padding:20px 0}

/* popups */
#menu{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45);padding:12px}
.sheet{width:100%;max-width:380px;border-radius:22px;padding:14px;box-shadow:0 8px 32px rgba(0,0,0,.35)}
.sheet button{margin-bottom:8px}
.sheet button:last-child{margin-bottom:0}
.sheet button.danger{color:#ff8a8a}
.ov{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:20px}
.ov .box{width:100%;max-width:330px;border-radius:22px;padding:18px;background:rgba(32,58,67,.94);box-shadow:0 8px 32px rgba(0,0,0,.5)}
.ov h3{margin:0 0 6px;font-size:18px}
.ov p{margin:0 0 14px;color:var(--sub);font-size:14px;line-height:1.4}
.ov .db{display:flex;gap:8px}
.ov .db button{flex:1;margin:0;padding:12px;width:auto}
.ov button.dng{background:#ff5a5f;color:#fff}
#ferr{color:#ff8a8a;font-size:13px;min-height:18px;margin:-4px 0 6px}
#viewer{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.93)}
#viewer img{max-width:100%;max-height:100%}
#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:rgba(0,0,0,.78);color:#fff;padding:8px 16px;border-radius:18px;font-size:14px;display:none;max-width:80%;text-align:center}

/* insects */
#bugs{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:5}
.bug{position:absolute;left:0;top:0;width:34px;height:34px;font-size:30px;line-height:34px;text-align:center;will-change:transform;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))}
.bug img.emo{width:34px;height:34px;vertical-align:top;margin:0}
.m.nib{animation:nib .22s linear infinite}
@keyframes nib{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-3px) rotate(-1deg)}75%{transform:translateX(3px) rotate(1deg)}}
.m.eaten{-webkit-mask-image:radial-gradient(circle at 100% 18%,transparent 11px,#000 12px),radial-gradient(circle at 0% 75%,transparent 9px,#000 10px),radial-gradient(circle at 62% 100%,transparent 10px,#000 11px),radial-gradient(circle at 30% 0%,transparent 7px,#000 8px);
-webkit-mask-composite:source-in;mask-image:radial-gradient(circle at 100% 18%,transparent 11px,#000 12px),radial-gradient(circle at 0% 75%,transparent 9px,#000 10px),radial-gradient(circle at 62% 100%,transparent 10px,#000 11px),radial-gradient(circle at 30% 0%,transparent 7px,#000 8px);mask-composite:intersect}
.m.eaten>*:not(.n):not(.tm):not(.ate){display:none}
.m .ate{font-style:italic;color:var(--sub);font-size:14px}
#bugPick{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:6;display:none;padding:6px;border-radius:16px;max-width:210px;flex-wrap:wrap}
#bugPick button{width:44px;height:44px;padding:0;margin:0;background:transparent;border:0;font-size:26px}
.av{width:42px;height:42px;border-radius:50%;background:var(--glass);display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
#auth{display:none}#home{display:none}
#aDp{width:84px;height:84px;font-size:30px;margin:0 auto 12px;border:2px dashed var(--bd);cursor:pointer}
#pvDp{width:100px;height:100px;font-size:50px;margin:0 auto 10px}
.srow{display:flex;gap:8px;margin-bottom:10px}.srow input{margin:0}.srow button{width:auto;margin:0;padding:0 16px}
.me{display:flex;align-items:center;gap:10px;margin-bottom:14px;cursor:pointer}
.me b{flex:1;min-width:0;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me i{font-style:normal;color:var(--acc);font-size:13px;font-weight:700}
.rc i.ok{color:var(--acc);font-weight:700;font-size:20px;padding:2px 10px}
.lnk{text-align:center;color:var(--acc);font-weight:700;font-size:14px;cursor:pointer;margin-bottom:8px}
</style>
</head>
<body>

<div id="auth">
  <div class="card glass">
    <h1>💬 Simple Chat</h1>
    <p class="sub" id="aSub">Apna profile banao</p>
    <div class="av" id="aDp">📷</div>
    <input type="file" id="aFile" accept="image/*" style="display:none">
    <input id="aName" placeholder="Aapka naam" maxlength="20" autocomplete="off">
    <input id="aUn" placeholder="Username (unique)" maxlength="15" autocomplete="off" autocapitalize="none">
    <input id="aPin" type="password" inputmode="numeric" maxlength="6" placeholder="PIN (4-6 number)" autocomplete="off">
    <button id="aGo">Profile banao</button>
    <div class="lnk" id="aSwap">Pehle se account hai? Login</div>
    <div id="aErr" style="color:#ff8a8a;font-size:14px;min-height:18px"></div>
  </div>
</div>
<div id="home">
  <div class="card glass">
    <div class="me" id="meRow"><div class="av" id="meDp"></div><b id="nm"></b><i id="lo">logout</i></div>
    <div class="srow"><input id="sq" placeholder="🔍 Username search karo" maxlength="15" autocomplete="off" autocapitalize="none"><button id="sgo" class="alt">Search</button></div>
    <div id="sres"></div>
    <button id="create">➕ Create Room</button>
    <button id="pcreate" class="alt">🔒 Create Private Room</button>
    <input id="code" placeholder="Room code se join karo" maxlength="12" autocomplete="off" autocapitalize="characters">
    <button id="join" class="alt">Join Room</button>
    <div id="err"></div>
    <div class="recent" id="recentWrap"><div id="clist"></div><div id="recent"></div></div>
  </div>
</div>

<div id="chat">
  <header class="glass">
    <button class="hb" id="back">←</button><div class="av" id="hdp" style="display:none;width:36px;height:36px;font-size:20px"></div>
    <div class="t" id="hT" style="cursor:pointer"><b id="who">Chat</b><small id="status">connecting...</small></div>
    <button class="hb" id="bugBtn" title="Insect chhodo">🐞</button>
    <div class="avs" id="hav"></div>
    <div class="code" id="codeBox" title="Copy code"></div>
    <button class="hb" id="moreBtn">⋮</button>
  </header>
  <div id="msgs"></div>
  <div id="rec" class="glass">
    <div class="dot"></div><div class="tmr" id="tmr">0:00</div>
    <button type="button" class="alt" id="recCancel">✕</button>
    <button type="button" id="recSend">➤</button>
  </div>
  <div id="blockBar" class="glass"><span>🚫 Aapne ye contact block kiya hai</span><button type="button" id="unblockBtn">Unblock</button></div>
  <div id="reqBar" class="glass"><span id="reqTxt"></span><button type="button" id="reqYes">Accept</button><button type="button" class="alt" id="reqNo">✕</button></div>
  <div id="emo" class="glass"><div class="cats" id="emoCats"></div><div class="grid" id="emoGrid"></div></div>
  <form id="f" class="glass">
    <button type="button" class="ic" id="emoBtn" title="Emoji">😊</button>
    <button type="button" class="ic" id="attach" title="Photo / Video">📎</button>
    <input type="file" id="fileImg" accept="image/*" style="display:none">
    <input type="file" id="fileVid" accept="video/*" style="display:none">
    <input id="txt" placeholder="Message likho" autocomplete="off" maxlength="1000" enterkeyhint="send">
    <button type="button" id="mic" title="Voice message">🎤</button>
    <button type="submit" id="send">➤</button>
  </form>
  <div id="bugPick" class="glass"></div>
  <div id="bugs"></div>
</div>

<div id="menu"><div class="sheet glass" id="sheet"></div></div>
<div id="dlg" class="ov"><div class="box glass"><h3 id="dT"></h3><p id="dP"></p><div class="db"><button class="alt" id="dNo">Cancel</button><button class="dng" id="dYes">OK</button></div></div></div>
<div id="pv" class="ov"><div class="box glass" style="text-align:center"><div class="av" id="pvDp"></div><h3 id="pvN"></h3><p id="pvU"></p><button class="alt" id="pvEdit" style="display:none">✏️ Profile edit karo</button><button class="alt" id="pvX" style="margin:0">Close</button></div></div>
<div id="ep" class="ov"><div class="box glass">
  <h3>✏️ Profile edit</h3>
  <div class="av" id="eDp" style="width:84px;height:84px;font-size:34px;margin:0 auto 6px;cursor:pointer"></div>
  <div class="lnk" id="eRm" style="color:#ff8a8a">Photo hatao</div>
  <input type="file" id="eFile" accept="image/*" style="display:none">
  <input id="eName" placeholder="Naam" maxlength="20" autocomplete="off">
  <input id="eUn" placeholder="Username" maxlength="15" autocomplete="off" autocapitalize="none">
  <input id="ePin" type="password" inputmode="numeric" maxlength="6" placeholder="PIN (sirf username badalne par)" autocomplete="off">
  <div id="eErr" style="color:#ff8a8a;font-size:13px;min-height:18px;margin:-4px 0 6px"></div>
  <div class="db"><button class="alt" id="eNo">Cancel</button><button id="eSave">Save</button></div>
</div></div>
<div id="viewer"><img id="vimg" alt=""></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

(function(){

  var cid=Math.random().toString(36).slice(2,10);
  var uid="";
  try{
    uid=localStorage.getItem("uid")||"";
    if(!uid){uid="u"+Math.random().toString(36).slice(2,12);localStorage.setItem("uid",uid)}

  }catch(e){}

  var msgQ=null,db=null,ref=null,myName="",myCode="",curCode="",isDM=false,curOther="",connected=false,curClr=0,statusInt=null,lastDay="";

  function now(){return Date.now()+svOff}

  // =====================================================
  //  iOS emoji: Android/Windows par Apple wali images
  // =====================================================
  var EMO_RE=null;
  try{
    EMO_RE=new RegExp("(?:[\\u{1F1E6}-\\u{1F1FF}]{2}|[#*0-9]\\uFE0F?\\u20E3|\\p{Extended_Pictographic}(?:\\uFE0F|[\\u{1F3FB}-\\u{1F3FF}])*(?:\\u200D\\p{Extended_Pictographic}(?:\\uFE0F|[\\u{1F3FB}-\\u{1F3FF}])*)*)\\uFE0F?","gu");
  }catch(e){}
  var APPLE=/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
  var EMO_CDN="https://cdn.jsdelivr.net/npm/emoji-datasource-apple@15.0.1/img/apple/64/";
  function emoName(s){

      if(n<tries.length){im.src=EMO_CDN+tries[n]+".png";return}

      if(im.parentNode)im.parentNode.replaceChild(sp,im);
    };
    return im;

  var SKIPTAG={SCRIPT:1,STYLE:1,TEXTAREA:1,INPUT:1,NOSCRIPT:1};
  function emojify(n){
    if(!EMO_RE||!n)return;
    if(n.nodeType===3){
      var p=n.parentNode;
      if(!p||SKIPTAG[p.nodeName])return;
      if(p.closest&&p.closest("[data-ne]"))return;
      var t=n.nodeValue;
      EMO_RE.lastIndex=0;
      if(!EMO_RE.test(t))return;
      EMO_RE.lastIndex=0;
      var fr=document.createDocumentFragment(),last=0,m;
      while((m=EMO_RE.exec(t))){
        if(m.index>last)fr.appendChild(document.createTextNode(t.slice(last,m.index)));
        fr.appendChild(mkEmo(m[0]));
        last=m.index+m[0].length;
      }
      if(last<t.length)fr.appendChild(document.createTextNode(t.slice(last)));
      p.replaceChild(fr,n);
    }else if(n.nodeType===1){
      if(SKIPTAG[n.nodeName]||n.hasAttribute("data-ne"))return;
      var w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT,null,false),list=[],x;
      while((x=w.nextNode()))list.push(x);
      list.forEach(emojify);
    }
  }
  if(EMO_RE&&!APPLE){
    new MutationObserver(function(ms){
      ms.forEach(function(m){
        if(m.type==="characterData")emojify(m.target);
        else for(var i=0;i<m.addedNodes.length;i++)emojify(m.addedNodes[i]);
      });
    }).observe(document.body,{childList:true,subtree:true,characterData:true});
    emojify(document.body);
  }
  function onlyEmoji(t){
    if(!EMO_RE||!t||t.length>30)return false;
    if(t.replace(EMO_RE,"").replace(/\s/g,""))return false;
    var c=t.match(EMO_RE);
    return !!c&&c.length<=3;
  }

        URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.7));

        c.getContext("2d").drawImage(im,0,0,c.width,c.height);
        URL.revokeObjectURL(u);
        var q=.72,d=c.toDataURL("image/jpeg",q);
        while(d.length>900000&&q>.3){q-=.1;d=c.toDataURL("image/jpeg",q)}
        res(d);
      };
      im.onerror=function(){URL.revokeObjectURL(u);rej()};
      im.src=u;
    });
  }
  function sendMedia(type,data,dur){
    if(!ref||isBlocked()||!canSend())return;
    var o={cid:cid,uid:uid,name:myName,type:type,data:data,t:firebase.database.ServerValue.TIMESTAMP};
    if(dur)o.dur=dur;
    ref.push(o).catch(function(){sys("Bhejna fail ho gaya (file badi ho sakti hai)")});
    afterSend();
  }
  $("attach").onclick=function(){
    showSheet([
      ["🖼 Photo (Gallery)",function(){$("fileImg").click()}],
      ["🎞 Video (Gallery)",function(){$("fileVid").click()}],
      ["Cancel"]
    ]);
  };
  function onPick(){
    var f=this.files&&this.files[0];this.value="";
    if(!f||!ref)return;
    if(f.type.indexOf("image/")===0){
      sys("Photo bhej raha hoon...");
      imgToData(f).then(function(d){sendMedia("image",d)}).catch(function(){sys("Photo nahi khuli")});
    }else if(f.type.indexOf("video/")===0){
      if(f.size>3*1024*1024){sys("Video badi hai. Max 3 MB (chhota clip) bhejo");return}
      sys("Video bhej raha hoon...");
      blobToData(f).then(function(d){sendMedia("video",d)}).catch(function(){sys("Video nahi padh paya")});
    }else sys("Sirf photo ya video bhejo");
  }
  $("fileImg").onchange=onPick;
  $("fileVid").onchange=onPick;

  // ---- voice message ----
  var mr=null,chunks=[],recT0=0,recTick=null,recCancel=false,recStream=null;
  function fmt(s){return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2)}
  function recUI(on){
    $("rec").style.display=on?"flex":"none";
    $("f").style.display=on?"none":((isBlocked()||!canSend())?"none":"flex");
    if(on)closeEmo();
    if(!on&&recTick){clearInterval(recTick);recTick=null}
  }
  function startRec(){
    if(!ref||isBlocked()||!canSend())return;
    if(!navigator.mediaDevices||!window.MediaRecorder){sys("Is browser me voice record nahi hota");return}
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
      recStream=st;chunks=[];recCancel=false;
      var rc;try{rc=new MediaRecorder(st,{audioBitsPerSecond:32000})}catch(e){rc=new MediaRecorder(st)}
      mr=rc;
      rc.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
      rc.onstop=function(){
        recStream&&recStream.getTracks().forEach(function(t){t.stop()});recStream=null;
        var dur=Math.round((Date.now()-recT0)/1000);
        recUI(false);mr=null;
        if(recCancel||!chunks.length)return;
        var blob=new Blob(chunks,{type:rc.mimeType||"audio/webm"});
        if(blob.size>2.5*1024*1024){sys("Voice bahut lambi hai");return}
        blobToData(blob).then(function(d){sendMedia("audio",d,dur)});
      };
      recT0=Date.now();rc.start();
      $("tmr").textContent="0:00";recUI(true);
      recTick=setInterval(function(){
        var s=Math.round((Date.now()-recT0)/1000);$("tmr").textContent=fmt(s);
        if(s>=90)stopRec(false);
      },300);
    }).catch(function(){sys("Mic ki permission nahi mili")});
  }
  function stopRec(cancel){
    recCancel=!!cancel;
    if(mr&&mr.state!=="inactive")mr.stop();else recUI(false);
  }
  $("mic").onclick=startRec;
  $("recSend").onclick=function(){stopRec(false)};
  $("recCancel").onclick=function(){stopRec(true)};

  // ---- fun: insect chat pe ghoomta hai ----
  var BUGS=["🐛","🐜","🐞","🪲","🕷️","🦂","🐝","🦗"];
  BUGS.forEach(function(b){
    var x=document.createElement("button");x.type="button";x.textContent=b;
    x.onclick=function(){$("bugPick").style.display="none";sendBug(b)};
    $("bugPick").appendChild(x);
  });
  $("bugBtn").onclick=function(){
    var p=$("bugPick");p.style.display=p.style.display==="flex"?"none":"flex";
  };
  function sendBug(e){
    if(!bugRef){spawnBug(e);return}
    var r=bugRef.push({cid:cid,e:e,t:firebase.database.ServerValue.TIMESTAMP});
    r.catch(function(){spawnBug(e)});
    setTimeout(function(){try{r.remove()}catch(x){}},20000);
  }
  function sendEat(key){
    var opts=["🐛","🐜","🪲","🐞","🦗"],e=opts[Math.floor(Math.random()*opts.length)];
    if(!bugRef){eatMsg(e,key,true);return}
    var r=bugRef.push({cid:cid,e:e,eat:key,t:firebase.database.ServerValue.TIMESTAMP});
    r.catch(function(){eatMsg(e,key,true)});
    setTimeout(function(){try{r.remove()}catch(x){}},20000);
  }
  function eatMsg(emoji,key,starter){
    var tg=els[key];
    if(!tg||tg.classList.contains("eaten")||eating[key])return;
    var L=$("bugs");if(L.children.length>=10)return;
    eating[key]=1;
    try{tg.scrollIntoView({block:"center"})}catch(e){}
    var W=L.clientWidth,H=L.clientHeight;
    var el=document.createElement("div");el.className="bug";el.textContent=emoji;L.appendChild(el);
    var sides=[[Math.random()*W,-40],[W+40,Math.random()*H],[Math.random()*W,H+40],[-40,Math.random()*H]];
    var st=sides[Math.floor(Math.random()*4)],ex=sides[Math.floor(Math.random()*4)];
    var cx=st[0],cy=st[1],ang=Math.PI/2,phase=0,t0=0,last=null,done=false;
    var ox=.2+Math.random()*.6,oy=.3+Math.random()*.4,speed=140;
    function finish(){
      if(done)return;done=true;delete eating[key];
      tg.classList.remove("nib");applyEaten(key);
      if(starter&&ref)ref.child(key).child("eaten").set(true).catch(function(){});
    }
    var kill=setTimeout(function(){finish();el.remove()},25000);
    function step(ts){
      if(!el.parentNode)return;
      if(last===null)last=ts;
      var dt=Math.min(.05,(ts-last)/1000);last=ts;
      var tx,ty;
      if(phase<2&&!tg.parentNode){finish();phase=2}
      if(phase<2){
        var r=tg.getBoundingClientRect(),lr=L.getBoundingClientRect();
        tx=r.left-lr.left+r.width*ox;ty=r.top-lr.top+r.height*oy;
      }else{tx=ex[0];ty=ex[1]}
      var dx=tx-cx,dy=ty-cy,dist=Math.hypot(dx,dy);
      if(phase===0&&dist<14){phase=1;t0=ts;tg.classList.add("nib")}
      if(phase===1&&ts-t0>3200){finish();phase=2;return requestAnimationFrame(step)}
      if(phase===2&&dist<20){clearTimeout(kill);el.remove();return}
      var diff=Math.atan2(dy,dx)-ang;diff=Math.atan2(Math.sin(diff),Math.cos(diff));
      ang+=diff*Math.min(1,dt*6);
      if(phase===1){cx+=dx*Math.min(1,dt*8);cy+=dy*Math.min(1,dt*8)}
      else{cx+=Math.cos(ang)*speed*dt;cy+=Math.sin(ang)*speed*dt}
      var w=Math.sin(ts/(phase===1?45:70))*(phase===1?14:5);
      el.style.transform="translate("+(cx-17)+"px,"+(cy-17)+"px) rotate("+(ang*180/Math.PI+90+w)+"deg)";
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  function spawnBug(emoji){
    var L=$("bugs");if(L.children.length>=10)return;
    var W=L.clientWidth,H=L.clientHeight;
    var el=document.createElement("div");el.className="bug";el.textContent=emoji;L.appendChild(el);
    function edge(side){
      var r=Math.random();
      return side===0?[r*W,-40]:side===1?[W+40,r*H]:side===2?[r*W,H+40]:[-40,r*H];
    }
    var s0=Math.floor(Math.random()*4),s1=(s0+1+Math.floor(Math.random()*3))%4;
    var start=edge(s0),pts=[];
    for(var i=0;i<5;i++)pts.push([40+Math.random()*(W-80),90+Math.random()*(H-180)]);
    pts.push(edge(s1));
    var cx=start[0],cy=start[1],ang=Math.atan2(pts[0][1]-cy,pts[0][0]-cx),idx=0,last=null,pause=0;
    var speed=70+Math.random()*50;
    var kill=setTimeout(function(){el.remove()},45000);
    function step(ts){
      if(!el.parentNode)return;
      if(last===null)last=ts;
      var dt=Math.min(.05,(ts-last)/1000);last=ts;
      if(pause>ts){draw(ts);requestAnimationFrame(step);return}
      var tx=pts[idx][0],ty=pts[idx][1],dx=tx-cx,dy=ty-cy,dist=Math.hypot(dx,dy);
      if(dist<20){
        idx++;
        if(idx>=pts.length){clearTimeout(kill);el.remove();return}
        if(Math.random()<.5)pause=ts+300+Math.random()*700;
      }else{
        var diff=Math.atan2(dy,dx)-ang;diff=Math.atan2(Math.sin(diff),Math.cos(diff));
        ang+=diff*Math.min(1,dt*6);
        cx+=Math.cos(ang)*speed*dt;cy+=Math.sin(ang)*speed*dt;
      }
      draw(ts);requestAnimationFrame(step);
    }
    function draw(ts){
      var w=Math.sin(ts/70)*5;
      el.style.transform="translate("+(cx-17)+"px,"+(cy-17)+"px) rotate("+(ang*180/Math.PI+90+w)+"deg)";
    }
    requestAnimationFrame(step);
  }

  // ---- start ----
  setMode(true);
  if(me&&configured)enterApp();
  else if(me){$("home").style.display="flex"}
  else $("auth").style.display="flex";
  updSend();
})();
</script>
