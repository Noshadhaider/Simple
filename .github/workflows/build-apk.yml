name: Build Chatly APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web app
        env:
          PUSH_URL: ${{ secrets.PUSH_URL }}
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
        run: |
          set -e
          test -f index.html || { echo "index.html repo ke root mein nahi hai"; exit 1; }
          mkdir -p apk/www
          cp index.html apk/www/index.html
          python3 - <<'PY'
          import os
          p = "apk/www/index.html"
          s = open(p, encoding="utf-8").read()
          url = os.environ.get("PUSH_URL", "").strip()
          key = os.environ.get("PUSH_KEY", "").strip()
          a = 'var PUSH_URL   = "";'
          b = 'var PUSH_KEY   = "";'
          if url and a in s:
              s = s.replace(a, 'var PUSH_URL   = "%s";' % url)
          if key and b in s:
              s = s.replace(b, 'var PUSH_KEY   = "%s";' % key)
          open(p, "w", encoding="utf-8").write(s)
          print("PUSH_URL set:", bool(url), "| PUSH_KEY set:", bool(key))
          PY

      - name: Create Capacitor Android project
        run: |
          set -e
          cd apk
          cat > package.json <<'JSON'
          {
            "name": "chatly-apk",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.0.0",
              "@capacitor/app": "^7.0.0",
              "@capacitor/cli": "^7.0.0",
              "@capacitor/core": "^7.0.0",
              "@capacitor/push-notifications": "^7.0.0"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.noshad.chatly",
            "appName": "Chatly",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "plugins": {
              "PushNotifications": { "presentationOptions": ["badge", "sound", "alert"] }
            }
          }
          JSON
          npm install
          npx cap add android
          npx cap sync android

      - name: Add screenshot detector, push, signing, icon
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -e
          cd apk
          pip install pillow
          PKG=android/app/src/main/java/com/noshad/chatly
          mkdir -p "$PKG"
          cat > "$PKG/MainActivity.java" <<'JAVA'
          package com.noshad.chatly;

          import android.app.NotificationManager;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              public static volatile boolean visible = false;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ScreenGuardPlugin.class);
                  super.onCreate(savedInstanceState);
                  if (KeepAliveService.enabled(this)) KeepAliveService.start(this);
              }

              @Override
              public void onStart() {
                  super.onStart();
                  visible = true;
                  try {
                      NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                      if (nm != null) nm.cancelAll();
                  } catch (Throwable t) { /* ignore */ }
              }

              @Override
              public void onStop() {
                  visible = false;
                  super.onStop();
              }
          }
          JAVA
          cat > "$PKG/ScreenGuardPlugin.java" <<'JAVA'
          package com.noshad.chatly;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ContentResolver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.database.ContentObserver;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.view.WindowManager;

          import androidx.core.content.ContextCompat;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          import java.util.concurrent.Executor;
          import java.util.function.Consumer;

          @CapacitorPlugin(
              name = "ScreenGuard",
              permissions = {
                  @Permission(alias = "media", strings = { Manifest.permission.READ_MEDIA_IMAGES }),
                  @Permission(alias = "storage", strings = { Manifest.permission.READ_EXTERNAL_STORAGE })
              }
          )
          public class ScreenGuardPlugin extends Plugin {

              private boolean started = false;
              private Object capCb = null;   // Android 14+  screenshot callback
              private Object recCb = null;   // Android 15+  screen recording callback
              private ContentObserver observer = null; // Android 13 aur neeche: gallery watcher
              private long lastId = -1;

              private String legacyAlias() {
                  return Build.VERSION.SDK_INT >= 33 ? "media" : "storage";
              }

              @PluginMethod
              public void start(PluginCall call) {
                  started = true;
                  if (Build.VERSION.SDK_INT >= 34 || getPermissionState(legacyAlias()) == PermissionState.GRANTED) {
                      registerAll();
                      call.resolve();
                  } else {
                      requestPermissionForAlias(legacyAlias(), call, "permResult");
                  }
              }

              @PluginMethod
              public void keepAlive(PluginCall call) {
                  boolean on = call.getBoolean("on", true);
                  boolean force = call.getBoolean("ask", false);
                  Context c = getContext();
                  SharedPreferences sp = c.getSharedPreferences("chatly", 0);
                  sp.edit().putBoolean("keep", on).apply();
                  if (on) {
                      KeepAliveService.start(c);
                      try {
                          PowerManager pm = (PowerManager) c.getSystemService(Context.POWER_SERVICE);
                          if (pm != null && !pm.isIgnoringBatteryOptimizations(c.getPackageName())
                                  && (force || !sp.getBoolean("batAsked", false))) {
                              sp.edit().putBoolean("batAsked", true).apply();
                              Intent i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                                      Uri.parse("package:" + c.getPackageName()));
                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              c.startActivity(i);
                          }
                      } catch (Throwable t) { /* ignore */ }
                  } else {
                      KeepAliveService.stop(c);
                  }
                  call.resolve();
              }

              @PermissionCallback
              private void permResult(PluginCall call) {
                  if (getPermissionState(legacyAlias()) == PermissionState.GRANTED) {
                      registerAll();
                      call.resolve();
                  } else {
                      call.reject("permission denied");
                  }
              }

              @Override
              protected void handleOnStart() {
                  if (started) registerAll();
              }

              @Override
              protected void handleOnStop() {
                  unregisterAll();
              }

              @Override
              protected void handleOnDestroy() {
                  unregisterAll();
              }

              private void emit(String kind) {
                  JSObject o = new JSObject();
                  o.put("kind", kind);
                  notifyListeners("capture", o);
              }

              private void registerAll() {
                  final Activity a = getActivity();
                  if (a == null) return;
                  Executor ex = ContextCompat.getMainExecutor(a);

                  if (Build.VERSION.SDK_INT >= 34) {
                      if (capCb == null) {
                          try {
                              Activity.ScreenCaptureCallback cb = new Activity.ScreenCaptureCallback() {
                                  @Override
                                  public void onScreenCaptured() {
                                      emit("shot");
                                  }
                              };
                              a.registerScreenCaptureCallback(ex, cb);
                              capCb = cb;
                          } catch (Throwable t) { /* ignore */ }
                      }
                  } else if (observer == null && getPermissionState(legacyAlias()) == PermissionState.GRANTED) {
                      try {
                          final ContentResolver cr = getContext().getContentResolver();
                          observer = new ContentObserver(new Handler(Looper.getMainLooper())) {
                              @Override
                              public void onChange(boolean selfChange, Uri uri) {
                                  checkLatestImage(cr);
                              }
                          };
                          cr.registerContentObserver(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, true, observer);
                      } catch (Throwable t) { observer = null; }
                  }

                  if (Build.VERSION.SDK_INT >= 35 && recCb == null) {
                      try {
                          Consumer<Integer> cb = new Consumer<Integer>() {
                              @Override
                              public void accept(Integer state) {
                                  if (state == null) return;
                                  if (state == WindowManager.SCREEN_RECORDING_STATE_VISIBLE) emit("record");
                                  else emit("recordstop");
                              }
                          };
                          int st = a.getWindowManager().addScreenRecordingCallback(ex, cb);
                          recCb = cb;
                          if (st == WindowManager.SCREEN_RECORDING_STATE_VISIBLE) emit("record");
                      } catch (Throwable t) { /* ignore */ }
                  }
              }

              @SuppressWarnings("unchecked")
              private void unregisterAll() {
                  final Activity a = getActivity();
                  try {
                      if (capCb != null && a != null && Build.VERSION.SDK_INT >= 34) {
                          a.unregisterScreenCaptureCallback((Activity.ScreenCaptureCallback) capCb);
                      }
                  } catch (Throwable t) { /* ignore */ }
                  capCb = null;
                  try {
                      if (recCb != null && a != null && Build.VERSION.SDK_INT >= 35) {
                          a.getWindowManager().removeScreenRecordingCallback((Consumer<Integer>) recCb);
                      }
                  } catch (Throwable t) { /* ignore */ }
                  recCb = null;
                  try {
                      if (observer != null) getContext().getContentResolver().unregisterContentObserver(observer);
                  } catch (Throwable t) { /* ignore */ }
                  observer = null;
              }

              private void checkLatestImage(ContentResolver cr) {
                  Cursor c = null;
                  try {
                      String[] proj = {
                          MediaStore.Images.Media._ID,
                          MediaStore.Images.Media.DISPLAY_NAME,
                          MediaStore.Images.Media.DATA,
                          MediaStore.Images.Media.DATE_ADDED
                      };
                      Uri uri = MediaStore.Images.Media.EXTERNAL_CONTENT_URI;
                      if (Build.VERSION.SDK_INT >= 26) {
                          Bundle args = new Bundle();
                          args.putStringArray(ContentResolver.QUERY_ARG_SORT_COLUMNS, new String[] { MediaStore.Images.Media.DATE_ADDED });
                          args.putInt(ContentResolver.QUERY_ARG_SORT_DIRECTION, ContentResolver.QUERY_SORT_DIRECTION_DESCENDING);
                          args.putInt(ContentResolver.QUERY_ARG_LIMIT, 1);
                          c = cr.query(uri, proj, args, null);
                      } else {
                          c = cr.query(uri, proj, null, null, MediaStore.Images.Media.DATE_ADDED + " DESC LIMIT 1");
                      }
                      if (c != null && c.moveToFirst()) {
                          long id = c.getLong(0);
                          String name = c.getString(1);
                          String data = c.getString(2);
                          long added = c.getLong(3);
                          String h = ((name == null ? "" : name) + " " + (data == null ? "" : data)).toLowerCase();
                          boolean looks = h.contains("screenshot") || h.contains("screen_shot") || h.contains("screencap")
                                  || h.contains("截屏") || h.contains("스크린샷");
                          long nowS = System.currentTimeMillis() / 1000L;
                          if (looks && id != lastId && Math.abs(nowS - added) < 20) {
                              lastId = id;
                              emit("shot");
                          }
                      }
                  } catch (Throwable t) {
                      /* ignore */
                  } finally {
                      if (c != null) c.close();
                  }
              }
          }
          JAVA
          cat > "$PKG/ChatlyMessagingService.java" <<'JAVA'
          package com.noshad.chatly;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.BitmapShader;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.Shader;
          import android.net.Uri;
          import android.os.Build;
          import android.util.Base64;

          import androidx.core.app.NotificationCompat;

          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;

          import org.json.JSONTokener;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.util.Map;

          /**
           * App band ho tab bhi chalti hai:
           *  1) message ka "delivered" (double tick) Firebase mein likhti hai
           *  2) naam + profile photo + message wali notification banati hai
           */
          public class ChatlyMessagingService extends FirebaseMessagingService {

              private static String enc(String s) {
                  try { return URLEncoder.encode(s, "UTF-8"); } catch (Exception e) { return s; }
              }

              private static boolean has(String s) { return s != null && !s.isEmpty(); }

              @Override
              public void onMessageReceived(RemoteMessage msg) {
                  Map<String, String> d = msg.getData();
                  if (d == null || d.isEmpty()) return;
                  if (KeepAliveService.enabled(this)) KeepAliveService.start(this);
                  String db = d.get("db"), room = d.get("r"), mk = d.get("m"), to = d.get("to");

                  // 1) delivered tick
                  if (has(db) && has(room) && has(mk) && has(to)) {
                      try {
                          put(db + "/rooms/" + enc(room) + "/messages/" + enc(mk) + "/delivered/" + enc(to) + ".json?print=silent", "true");
                      } catch (Throwable t) { /* ignore */ }
                  }

                  // 2) notification (app screen par khuli ho to app khud dikhati hai)
                  if (MainActivity.visible) return;
                  try { show(d); } catch (Throwable t) { /* ignore */ }
              }

              private void show(Map<String, String> d) {
                  String title = d.get("n"), body = d.get("b"), k = d.get("k"), g = d.get("g"), un = d.get("un"), db = d.get("db");
                  if (!has(title)) title = "Chatly";
                  if (body == null) body = "";

                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  if (nm == null) return;
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel("msgs", "Messages", NotificationManager.IMPORTANCE_HIGH);
                      ch.enableVibration(true);
                      nm.createNotificationChannel(ch);
                  }

                  String link = has(g) ? "chatly://open/g/" + enc(g) : "chatly://open/dm/" + enc(k == null ? "" : k);
                  Intent it = new Intent(this, MainActivity.class);
                  it.setAction(Intent.ACTION_VIEW);
                  it.setData(Uri.parse(link));
                  it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent pi = PendingIntent.getActivity(this, link.hashCode(), it,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  NotificationCompat.Builder b = new NotificationCompat.Builder(this, "msgs")
                          .setSmallIcon(android.R.drawable.stat_notify_chat)
                          .setContentTitle(title)
                          .setContentText(body)
                          .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                          .setAutoCancel(true)
                          .setContentIntent(pi)
                          .setCategory(NotificationCompat.CATEGORY_MESSAGE)
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setDefaults(NotificationCompat.DEFAULT_ALL);

                  if (has(db) && has(un)) {
                      Bitmap av = avatar(db, un);
                      if (av != null) b.setLargeIcon(av);
                  }
                  nm.notify(link, 1, b.build());
              }

              // sender ki profile photo (Firebase mein data-url) -> gol bitmap
              private static Bitmap avatar(String db, String un) {
                  try {
                      String txt = get(db + "/rooms/_n/" + enc(un) + "/dp.json");
                      if (txt == null) return null;
                      Object v = new JSONTokener(txt).nextValue();
                      if (!(v instanceof String)) return null;
                      String s = (String) v;
                      int i = s.indexOf(',');
                      if (i < 0) return null;
                      byte[] raw = Base64.decode(s.substring(i + 1), Base64.DEFAULT);
                      Bitmap src = BitmapFactory.decodeByteArray(raw, 0, raw.length);
                      if (src == null) return null;
                      int sz = Math.min(src.getWidth(), src.getHeight());
                      Bitmap sq = Bitmap.createBitmap(src, (src.getWidth() - sz) / 2, (src.getHeight() - sz) / 2, sz, sz);
                      Bitmap out = Bitmap.createBitmap(sz, sz, Bitmap.Config.ARGB_8888);
                      Canvas cv = new Canvas(out);
                      Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                      p.setShader(new BitmapShader(sq, Shader.TileMode.CLAMP, Shader.TileMode.CLAMP));
                      cv.drawCircle(sz / 2f, sz / 2f, sz / 2f, p);
                      return out;
                  } catch (Throwable t) {
                      return null;
                  }
              }

              private static String get(String url) throws Exception {
                  HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                  c.setConnectTimeout(8000);
                  c.setReadTimeout(8000);
                  try {
                      if (c.getResponseCode() != 200) return null;
                      InputStream in = c.getInputStream();
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                      in.close();
                      return bo.toString("UTF-8");
                  } finally {
                      c.disconnect();
                  }
              }

              private static void put(String url, String body) throws Exception {
                  HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                  c.setRequestMethod("PUT");
                  c.setConnectTimeout(8000);
                  c.setReadTimeout(8000);
                  c.setDoOutput(true);
                  c.setRequestProperty("Content-Type", "application/json");
                  try {
                      OutputStream o = c.getOutputStream();
                      o.write(body.getBytes("UTF-8"));
                      o.close();
                      c.getResponseCode();
                  } finally {
                      c.disconnect();
                  }
              }
          }
          JAVA
          cat > "$PKG/KeepAliveService.java" <<'JAVA'
          package com.noshad.chatly;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;

          import androidx.core.app.NotificationCompat;

          /**
           * App ko background mein zinda rakhti hai (foreground service).
           * Isse Firebase connection chalta rehta hai: msgs foran aate hain aur double tick lagta hai.
           */
          public class KeepAliveService extends Service {
              private static final String CH = "keep";

              public static boolean enabled(Context c) {
                  return c.getSharedPreferences("chatly", 0).getBoolean("keep", true);
              }

              public static void start(Context c) {
                  try {
                      Intent i = new Intent(c, KeepAliveService.class);
                      if (Build.VERSION.SDK_INT >= 26) c.startForegroundService(i);
                      else c.startService(i);
                  } catch (Throwable t) { /* ignore */ }
              }

              public static void stop(Context c) {
                  try { c.stopService(new Intent(c, KeepAliveService.class)); } catch (Throwable t) { /* ignore */ }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (!enabled(this)) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26 && nm != null) {
                      NotificationChannel ch = new NotificationChannel(CH, "Background connection", NotificationManager.IMPORTANCE_MIN);
                      ch.setShowBadge(false);
                      nm.createNotificationChannel(ch);
                  }
                  Intent it = new Intent(this, MainActivity.class);
                  it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent pi = PendingIntent.getActivity(this, 7, it,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Notification n = new NotificationCompat.Builder(this, CH)
                          .setSmallIcon(android.R.drawable.stat_notify_chat)
                          .setContentTitle("Chatly is running")
                          .setContentText("Connected in background")
                          .setOngoing(true)
                          .setContentIntent(pi)
                          .setPriority(NotificationCompat.PRIORITY_MIN)
                          .build();
                  try {
                      if (Build.VERSION.SDK_INT >= 34) {
                          startForeground(7, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                      } else {
                          startForeground(7, n);
                      }
                  } catch (Throwable t) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  return START_STICKY;
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          JAVA
          cat > "$PKG/BootReceiver.java" <<'JAVA'
          package com.noshad.chatly;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (KeepAliveService.enabled(context)) KeepAliveService.start(context);
              }
          }
          JAVA
          if [ -n "$GSJ" ]; then
            printf '%s' "$GSJ" > android/app/google-services.json
            echo "google-services.json added"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret nahi hai - push notification kaam nahi karegi"
          fi
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/chatly.keystore
          fi
          python3 - <<'PY'
          import os, re, io, base64, shutil, json

          A = "android/app"

          # ---- 1) AndroidManifest permissions ----
          mp = A + "/src/main/AndroidManifest.xml"
          m = open(mp, encoding="utf-8").read()
          perms = [
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.VIBRATE" />',
              '<uses-permission android:name="android.permission.DETECT_SCREEN_CAPTURE" />',
              '<uses-permission android:name="android.permission.DETECT_SCREEN_RECORDING" />',
              '<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />',
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />',
              '<uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />',
              '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
              '<uses-feature android:name="android.hardware.camera" android:required="false" />',
              '<uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />',
              '<uses-feature android:name="android.hardware.microphone" android:required="false" />',
          ]
          add = ""
          for p in perms:
              name = re.search(r'android:name="([^"]+)"', p).group(1)
              if name not in m:
                  add += "    " + p + "\n"
          if "<queries>" not in m:
              add += """    <queries>
                  <intent><action android:name="android.media.action.IMAGE_CAPTURE" /></intent>
                  <intent><action android:name="android.media.action.VIDEO_CAPTURE" /></intent>
              </queries>
          """
          m = m.replace("</manifest>", add + "</manifest>")
          svc = """        <service android:name=".ChatlyMessagingService" android:exported="false">
                      <intent-filter android:priority="100">
                          <action android:name="com.google.firebase.MESSAGING_EVENT" />
                      </intent-filter>
                  </service>
          """
          if "ChatlyMessagingService" not in m:
              m = m.replace("</application>", svc + "    </application>")
          keep = """        <service android:name=".KeepAliveService" android:exported="false" android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="Keeps the chat connection alive in the background to receive messages" />
                  </service>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
          """
          if "KeepAliveService" not in m:
              m = m.replace("</application>", keep + "    </application>")
          open(mp, "w", encoding="utf-8").write(m)
          print("manifest patched")

          # ---- 2) targetSdk 34 (Android 15 edge-to-edge se bachne ke liye) ----
          vp = "android/variables.gradle"
          v = open(vp, encoding="utf-8").read()
          v = re.sub(r"targetSdkVersion\s*=\s*\d+", "targetSdkVersion = 34", v)
          open(vp, "w", encoding="utf-8").write(v)
          print("targetSdk set to 34")

          # ---- 3) google-services.json check ----
          gs = A + "/google-services.json"
          if os.path.exists(gs):
              try:
                  j = json.load(open(gs, encoding="utf-8"))
                  pk = [c["client_info"]["android_client_info"]["package_name"] for c in j.get("client", [])]
                  print("google-services packages:", pk)
                  if "com.noshad.chatly" not in pk:
                      print("::warning::google-services.json mein package com.noshad.chatly nahi hai - push kaam nahi karega")
              except Exception as e:
                  print("::warning::google-services.json parse nahi hui:", e)

          # ---- 3b) firebase-messaging app module ko bhi chahiye (custom service ke liye) ----
          g0 = open(A + "/build.gradle", encoding="utf-8").read()
          g0 += """

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:33.7.0')
              implementation 'com.google.firebase:firebase-messaging'
          }
          """
          open(A + "/build.gradle", "w", encoding="utf-8").write(g0)
          print("firebase-messaging dependency added")

          # ---- 4) signing (taaki update install ho sake) ----
          if os.path.exists(A + "/chatly.keystore"):
              g = open(A + "/build.gradle", encoding="utf-8").read()
              g += """

          android {
              signingConfigs {
                  chatly {
                      storeFile file('chatly.keystore')
                      storeType 'pkcs12'
                      storePassword 'chatly123'
                      keyAlias 'chatly'
                      keyPassword 'chatly123'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.chatly
                  }
              }
          }
          """
              open(A + "/build.gradle", "w", encoding="utf-8").write(g)
              print("signing configured")
          else:
              print("::warning::KEYSTORE_B64 secret nahi hai - har build ki signature alag hogi, update ke liye pehle purani app uninstall karni padegi")

          # ---- 5) launcher icon (aapke logo se) ----
          try:
              from PIL import Image
              s = open("www/index.html", encoding="utf-8").read()
              mt = re.search(r'<link rel="apple-touch-icon" href="data:image/png;base64,([^"]+)"', s)
              img = Image.open(io.BytesIO(base64.b64decode(mt.group(1)))).convert("RGBA")
              res = A + "/src/main/res"
              for d, sz in {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
                  dd = res + "/mipmap-" + d
                  os.makedirs(dd, exist_ok=True)
                  im = img.resize((sz, sz), Image.LANCZOS)
                  im.save(dd + "/ic_launcher.png")
                  im.save(dd + "/ic_launcher_round.png")
              shutil.rmtree(res + "/mipmap-anydpi-v26", ignore_errors=True)
              print("icon set")
          except Exception as e:
              print("::warning::icon set nahi hua:", e)
          PY

      - name: Build APK
        run: |
          set -e
          cd apk/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../../Chatly.apk

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Chatly APK ${{ github.run_number }}
          files: Chatly.apk
          make_latest: true
